services:
  awamesh:
    image: ghcr.io/OWNER/awamesh:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: awamesh
    ports:
      - "18443:18443"          # 面板
      # - "18444:18444"        # 本机同时做中继时打开
    environment:
      - AWA_SECRET=change_me_to_a_long_random_string
      - AWA_PORT=18443
      # - AWA_RELAY_PORT=18444
      - AWA_DATA_DIR=/data
      - AWA_MODE=full                 # full | tiny（tiny：少占内存，事件保留 3 天）
      - AWA_BACKEND=mock              # mock 演示 | headscale 接入真实控制面
      # - AWA_HEADSCALE_CMD=headscale
      # - AWA_HEADSCALE_USER=awamesh
      # - AWA_CONTROL_URL=https://mesh.example.com
      # - AWA_CF_TOKEN=                # Cloudflare API Token（只读即可）
      - AWA_MESH_CIDR=10.88.0.0/24
      - AWA_EVENT_KEEP_DAYS=30
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
    mem_limit: 192m
    cpus: 1.0
    restart: unless-stopped
